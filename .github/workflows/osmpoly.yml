name: osmpoly
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: polygons
        run: |
          Q='[out:json][timeout:220];(way["place"~"^(neighbourhood|suburb|quarter|village|hamlet|borough|locality)$"](41.00,-73.60,41.50,-72.55);relation["place"~"^(neighbourhood|suburb|quarter|village|hamlet|borough|locality)$"](41.00,-73.60,41.50,-72.55);way["boundary"="administrative"]["admin_level"~"^(9|10)$"](41.00,-73.60,41.50,-72.55);relation["boundary"="administrative"]["admin_level"~"^(9|10)$"](41.00,-73.60,41.50,-72.55););out geom;'
          for host in overpass-api.de overpass.kumi.systems; do
            code=$(curl -sS -o raw.json -w '%{http_code}' --max-time 240 -A "MBD-site-build/1.0" --data-urlencode "data=$Q" "https://$host/api/interpreter" || echo FAIL)
            echo "$host -> $code, $(wc -c < raw.json) bytes"
            [ "$code" = "200" ] && break
          done
          python3 - <<'EOF'
          import json
          d=json.load(open('raw.json'))
          out=[]
          for e in d.get('elements',[]):
              nm=e.get('tags',{}).get('name')
              if not nm: continue
              if e['type']=='way' and e.get('geometry'):
                  ring=[[p['lon'],p['lat']] for p in e['geometry']]
                  if len(ring)>3: out.append({'n':nm,'rings':[ring],'t':e['tags'].get('place') or e['tags'].get('admin_level')})
              elif e['type']=='relation':
                  rings=[[[p['lon'],p['lat']] for p in m['geometry']]
                         for m in e.get('members',[]) if m.get('role')=='outer' and m.get('geometry')]
                  rings=[r for r in rings if len(r)>3]
                  if rings: out.append({'n':nm,'rings':rings,'t':e['tags'].get('place') or e['tags'].get('admin_level')})
          json.dump(out,open('osm-poly.json','w'))
          print('named polygons:',len(out))
          EOF
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add osm-poly.json && git commit -m "osm polygons" && git push
