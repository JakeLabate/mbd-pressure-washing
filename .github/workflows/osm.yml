name: osm
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > q.txt <<'EOF'
          [out:json][timeout:240];
          area["ISO3166-2"="US-CT"][admin_level=4]->.a;
          (
            node["place"~"^(neighbourhood|suburb|hamlet|locality|village|quarter|borough)$"](area.a);
          );
          out body;
          EOF
          curl -sS --max-time 260 -X POST -d @q.txt https://overpass-api.de/api/interpreter -o osm-places.json
          python3 -c "
import json
d=json.load(open('osm-places.json'))
els=[e for e in d.get('elements',[]) if e.get('tags',{}).get('name')]
out=[{'name':e['tags']['name'],'lat':e['lat'],'lon':e['lon'],'place':e['tags'].get('place')} for e in els]
json.dump(out,open('osm-places.json','w'))
print('places:',len(out))
"
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add osm-places.json; git commit -m osm || true; git push
