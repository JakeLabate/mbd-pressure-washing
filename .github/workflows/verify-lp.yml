name: verify-lp
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > lp-verify.txt
          for u in lp/roof-washing-guilford-ct lp/fence-cleaning-milford-ct lp/patio-cleaning-seymour-ct lp/house-washing-westport-ct; do
            echo "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://mbdpressurewashing.net/$u/)  $u" >> lp-verify.txt
          done
          curl -sS --max-time 20 https://mbdpressurewashing.net/lp/roof-washing-guilford-ct/ -o lp.txt
          grep -oE '<meta name="robots" content="[^"]*"' lp.txt >> lp-verify.txt
          grep -oE '<title>[^<]*</title>' lp.txt >> lp-verify.txt
          echo "came_from fields: $(grep -c came_from lp.txt)" >> lp-verify.txt
          echo "sitemap /lp/ entries: $(curl -sS --max-time 20 https://mbdpressurewashing.net/sitemap.xml | grep -c '/lp/')" >> lp-verify.txt
          echo "robots disallow lines: $(curl -sS --max-time 20 https://mbdpressurewashing.net/robots.txt | grep -ci disallow)" >> lp-verify.txt
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add lp-verify.txt; git commit -m verify || true; git push
