name: probe-social
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > social-probe.txt
          for p in "" about f-a-q contact services; do
            url="https://mbdpressurewashing.net/$p"
            echo "=== $url ===" >> social-probe.txt
            curl -sSL --max-time 45 -A "Mozilla/5.0" "$url" -o page.html || { echo "FETCH FAILED" >> social-probe.txt; continue; }
            echo "bytes: $(wc -c < page.html)" >> social-probe.txt
            grep -oiE 'https?://[a-z0-9./_-]*(instagram|facebook|fb\.com|twitter|x\.com|tiktok|youtube|youtu\.be|linkedin|yelp|nextdoor|threads|pinterest)[a-z0-9./_?=-]*' page.html | sort -u >> social-probe.txt
            grep -oiE '(instagram|facebook|tiktok|youtube|yelp)[^<>"]{0,60}' page.html | sort -u | head -25 >> social-probe.txt
            grep -oiE 'mailto:[a-z0-9._%+-]+@[a-z0-9.-]+' page.html | sort -u >> social-probe.txt
            grep -oiE '@[a-z0-9._]{3,30}' page.html | sort -u | head -25 >> social-probe.txt
          done
          wc -l social-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add social-probe.txt
          git commit -m "Social probe results" || echo "no change"
          git push
