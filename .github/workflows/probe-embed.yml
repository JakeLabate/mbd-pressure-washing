name: probe-embed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          REF=3cfdab0ed5fc52f7f8c9ddaa4e19e623f2dfcd98
          : > embed-probe.txt
          probe () {
            echo "=== $1 ===" >> embed-probe.txt
            code=$(curl -sSL --compressed -o body.raw -w '%{http_code}' --max-time 40 -A "Mozilla/5.0" -e "https://mbdpressurewashing.net/" "$1" || echo FAIL)
            echo "http: $code  bytes: $(wc -c < body.raw)" >> embed-probe.txt
            tr -cd '[:print:][:space:]' < body.raw > body.txt
            head -c 1400 body.txt >> embed-probe.txt
            echo "" >> embed-probe.txt
          }
          probe "https://www.google.com/maps?cid=3004312232742849809"
          echo "--- identity ---" >> embed-probe.txt
          grep -oiE '<title>[^<]{0,120}</title>' body.txt | head -3 >> embed-probe.txt
          grep -oiE '(MBD|Pressure Washing|Milford|Connecticut|475.?450.?6215)[^<"]{0,40}' body.txt | sort -u | head -12 >> embed-probe.txt
          echo "--- place id from widget ---" >> embed-probe.txt
          probe "https://embedsocial.com/api/pro_hashtag/$REF/"
          grep -oiE 'placeid=[A-Za-z0-9_-]{10,40}' body.txt | sort -u >> embed-probe.txt
          grep -oiE '"(name|business_name|source_name)":"[^"]{0,50}"' body.txt | sort -u | head -10 >> embed-probe.txt
          wc -c embed-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add embed-probe.txt
          git commit -m "Embed probe results" || echo "no change"
          git push
