name: probe-embed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
      - run: |
          REF=3cfdab0ed5fc52f7f8c9ddaa4e19e623f2dfcd98
          : > embed-probe.txt
          probe () {
            echo "=== $1 ===" >> embed-probe.txt
            code=$(curl -sSL --compressed -o body.raw -w '%{http_code}' --max-time 40 -A "Mozilla/5.0" -e "https://mbdpressurewashing.net/" "$1" || echo FAIL)
            echo "http: $code  bytes: $(wc -c < body.raw)" >> embed-probe.txt
            tr -cd '[:print:][:space:]' < body.raw > body.txt
            head -c 1400 body.txt >> embed-probe.txt
            echo "" >> embed-probe.txt
          }
          echo "--- sample landing pages live ---" >> embed-probe.txt
          for u in lp/roof-washing-guilford-ct lp/fence-cleaning-milford-ct lp/patio-cleaning-seymour-ct lp/house-washing-westport-ct; do
            echo "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://mbdpressurewashing.net/$u/)  $u" >> embed-probe.txt
          done
          echo "--- noindex present, AdsBot not blocked ---" >> embed-probe.txt
          curl -sS --max-time 20 https://mbdpressurewashing.net/lp/roof-washing-guilford-ct/ -o lp.txt
          grep -oE '<meta name="robots" content="[^"]*"' lp.txt >> embed-probe.txt
          grep -oE '<title>[^<]*</title>' lp.txt >> embed-probe.txt
          grep -c 'came_from' lp.txt >> embed-probe.txt
          echo "--- sitemap must not contain /lp/ ---" >> embed-probe.txt
          curl -sS --max-time 20 https://mbdpressurewashing.net/sitemap.xml | grep -c "/lp/" >> embed-probe.txt
          echo "--- robots.txt must not disallow /lp/ ---" >> embed-probe.txt
          curl -sS --max-time 20 https://mbdpressurewashing.net/robots.txt | grep -ci disallow >> embed-probe.txt
          wc -c embed-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add embed-probe.txt
          git commit -m "Embed probe results" || echo "no change"
          git push
