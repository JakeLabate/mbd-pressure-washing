name: probe-embed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
      - run: |
          REF=3cfdab0ed5fc52f7f8c9ddaa4e19e623f2dfcd98
          : > embed-probe.txt
          probe () {
            echo "=== $1 ===" >> embed-probe.txt
            code=$(curl -sSL --compressed -o body.raw -w '%{http_code}' --max-time 40 -A "Mozilla/5.0" -e "https://mbdpressurewashing.net/" "$1" || echo FAIL)
            echo "http: $code  bytes: $(wc -c < body.raw)" >> embed-probe.txt
            tr -cd '[:print:][:space:]' < body.raw > body.txt
            head -c 1400 body.txt >> embed-probe.txt
            echo "" >> embed-probe.txt
          }
          echo "--- photo assets live ---" >> embed-probe.txt
          for f in mbd-owner.jpg mbd-owner-sm.jpg mbd-fence-before-after.jpg mbd-fence-before-after-sm.jpg mbd-video.mp4; do
            echo "$(curl -sSI --max-time 25 https://mbdpressurewashing.net/img/$f | awk '/^HTTP|^content-type|^content-length/{printf "%s ", $2}')  $f" >> embed-probe.txt
          done
          echo "--- pages referencing them ---" >> embed-probe.txt
          for u in / /about/ /decks-fences-patios/; do
            n=$(curl -sS --max-time 25 https://mbdpressurewashing.net$u | grep -oE 'mbd-(owner|fence-before-after)[a-z-]*\.jpg' | sort -u | tr '\n' ' ')
            echo "$u -> $n" >> embed-probe.txt
          done
          wc -c embed-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add embed-probe.txt
          git commit -m "Embed probe results" || echo "no change"
          git push
