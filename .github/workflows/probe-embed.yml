name: probe-embed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          REF=3cfdab0ed5fc52f7f8c9ddaa4e19e623f2dfcd98
          : > embed-probe.txt
          probe () {
            echo "=== $1 ===" >> embed-probe.txt
            code=$(curl -sSL --compressed -o body.raw -w '%{http_code}' --max-time 40 -A "Mozilla/5.0" -e "https://mbdpressurewashing.net/" "$1" || echo FAIL)
            echo "http: $code  bytes: $(wc -c < body.raw)" >> embed-probe.txt
            tr -cd '[:print:][:space:]' < body.raw > body.txt
            head -c 1400 body.txt >> embed-probe.txt
            echo "" >> embed-probe.txt
          }
          probe "https://embedsocial.com/api/pro_hashtag/$REF/"
          echo "--- background / theme colour config ---" >> embed-probe.txt
          grep -oiE '(background|bgColor|backgroundColor|widgetBackground|bg_color|themeColor|cardBackground)[^,;}]{0,60}' body.txt | sort -u | head -40 >> embed-probe.txt
          echo "--- every hex colour, most frequent first ---" >> embed-probe.txt
          grep -oiE '#[0-9a-f]{6}' body.txt | tr 'A-F' 'a-f' | sort | uniq -c | sort -rn | head -25 >> embed-probe.txt
          echo "--- rgb() values ---" >> embed-probe.txt
          grep -oiE 'rgba?\([0-9]{1,3}, ?[0-9]{1,3}, ?[0-9]{1,3}[^)]*\)' body.txt | sort | uniq -c | sort -rn | head -15 >> embed-probe.txt
          wc -c embed-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add embed-probe.txt
          git commit -m "Embed probe results" || echo "no change"
          git push
