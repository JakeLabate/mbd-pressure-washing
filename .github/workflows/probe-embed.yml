name: probe-embed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          REF=3cfdab0ed5fc52f7f8c9ddaa4e19e623f2dfcd98
          : > embed-probe.txt
          probe () {
            echo "=== $1 ===" >> embed-probe.txt
            code=$(curl -sSL --compressed -o body.raw -w '%{http_code}' --max-time 40 -A "Mozilla/5.0" -e "https://mbdpressurewashing.net/" "$1" || echo FAIL)
            echo "http: $code  bytes: $(wc -c < body.raw)" >> embed-probe.txt
            tr -cd '[:print:][:space:]' < body.raw > body.txt
            head -c 1400 body.txt >> embed-probe.txt
            echo "" >> embed-probe.txt
          }
          echo "--- where does it redirect ---" >> embed-probe.txt
          curl -sSI --max-time 20 "https://mbdpressurewashing.net/about/" | grep -iE '^(HTTP|location|server)' >> embed-probe.txt
          echo "--- following redirects ---" >> embed-probe.txt
          for u in / /about/ /faq/ /f-a-q/; do
            code=$(curl -sSL -o pg.txt -w '%{http_code} -> %{url_effective}' --max-time 25 "https://mbdpressurewashing.net$u" || echo FAIL)
            echo "$u  =>  $code" >> embed-probe.txt
          done
          echo "--- final home identity ---" >> embed-probe.txt
          curl -sSL --max-time 25 "https://mbdpressurewashing.net/" -o home.txt || true
          grep -oE '<title>[^<]*</title>' home.txt | head -1 >> embed-probe.txt
          grep -oE 'rel="canonical" href="[^"]*"' home.txt | head -1 >> embed-probe.txt
          grep -c 'embedsocial-hashtag' home.txt >> embed-probe.txt
          wc -c embed-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add embed-probe.txt
          git commit -m "Embed probe results" || echo "no change"
          git push
