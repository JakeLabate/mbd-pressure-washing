name: probe-embed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          REF=3cfdab0ed5fc52f7f8c9ddaa4e19e623f2dfcd98
          : > embed-probe.txt
          probe () {
            echo "=== $1 ===" >> embed-probe.txt
            code=$(curl -sS --compressed -o body.raw -w '%{http_code}' --max-time 40 -A "Mozilla/5.0" "$1" || echo FAIL)
            echo "http: $code  bytes: $(wc -c < body.raw)" >> embed-probe.txt
            tr -cd '[:print:][:space:]' < body.raw > body.txt
            head -c 600 body.txt >> embed-probe.txt
            echo "" >> embed-probe.txt
          }
          probe "https://embedsocial.com/cdn/ht.js"
          probe "https://embedsocial.com/api/pro_hashtag/$REF"
          probe "https://embedsocial.com/facebook_feed/pro_hashtag/$REF"
          probe "https://embedsocial.com/widget/ht/$REF"
          wc -c embed-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add embed-probe.txt
          git commit -m "Embed probe results" || echo "no change"
          git push
