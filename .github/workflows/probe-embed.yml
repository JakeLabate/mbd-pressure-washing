name: probe-embed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          REF=3cfdab0ed5fc52f7f8c9ddaa4e19e623f2dfcd98
          : > embed-probe.txt
          for u in             "https://embedsocial.com/cdn/ht.js"             "https://embedsocial.com/api/pro_hashtag/$REF"             "https://embedsocial.com/facebook_feed/pro_hashtag/$REF"             "https://embedsocial.com/admin/localstorage/$REF" ; do
            echo "=== $u ===" >> embed-probe.txt
            code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 40 -A "Mozilla/5.0" "$u" || echo FAIL)
            echo "http: $code  bytes: $(wc -c < body.txt)" >> embed-probe.txt
            head -c 700 body.txt >> embed-probe.txt
            echo "" >> embed-probe.txt
            grep -oiE '"(rating|reviewsCount|totalReviews|averageRating|name)":[^,}]{0,40}' body.txt | head -12 >> embed-probe.txt
            echo "" >> embed-probe.txt
          done
          wc -c embed-probe.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add embed-probe.txt
          git commit -m "Embed probe results" || echo "no change"
          git push
